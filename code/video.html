<!DOCTYPE html>
<html>
    <head>
        <title>
            Adding video file
        </title>
    </head>
    <body>
        <header>
            this file includes the addition of video file 
        </header> 

        <h3>
            Its all about you song:
        </h3>

        <!-- we can autoplay the song by writing autoplay after controls, mute the song and also can play the song in loop
          if you have a specific type of video file which might not be accessible to others browser then you can add more than one type 
          so that which ever will be able can be played-->
        <video controls height="500">
            <source src="Video/Its All About You.mp4" >
        </video>

        <h3>
            Chosen song:
        </h3>

        <video controls height="500">
            <source src="Video/Chosen.mp4" >
        </video>

        <h3>
            Dark Love song:
        </h3>

        <video controls height="500">
            <source src="Video/Dark Love.mp4" >
        </video>

        <h3>
            Sohne Lagde song:
        </h3>

        <video controls height="500">
            <source src="Video/Sohne Lagde.mp4" >
        </video>
    </body>
</html>
