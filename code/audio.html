<!DOCTYPE html>
<html>
    <Head>
        <title>
            Adding Audio file
        </title>
    </Head>
    <body>
        <header>
            This website includes the addition of audio file
        </header>

        <h3>
            Its all about you song:
        </h3>

        <!-- we can autoplay the song by writing autoplay after controls, mute the song and also can play the song in loop
          if you have a specific type of audio file which might not be accessible to others browser then you can add more than one type 
          so that which ever will be able can be played-->
        <audio controls>
            <source src="audio/Its All About You.mp3" >
        </audio>

        <h3>
            Chosen song:
        </h3>

        <audio controls>
            <source src="audio/Chosen.mp3" >
        </audio>

        <h3>
            Dark Love song:
        </h3>

        <audio controls>
            <source src="audio/Dark Love.mp3" >
        </audio>

        <h3>
            Sohne Lagde song:
        </h3>

        <audio controls>
            <source src="audio/Sohne Lagde.mp3" >
        </audio>
    </body>
</html>
