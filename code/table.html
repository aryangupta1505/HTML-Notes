<!DOCTYPE html>
<html>
    <head>
        <title>
            Adding table 
        </title>
    </head>
    <body>
        <h1>
            table:
        </h1>
        <table border="2">
        <tr style="text-align: center;">    <!-- table row-->
            <th style="width: 100px;">Monday</th> <!-- column header-->
            <th style="width: 100px;">Tuesday</th>
            <th style="width: 100px;">Wednesday</th>
            <th style="width: 100px;">Thursday</th>
        </tr>
        <tr style="text-align: center;">
            <td>1<sup>st</sup> Day</td>
            <td>2<sup>nd</sup> Day</td>
            <td>3<sup>rd</sup> Day</td>
            <td>4<sup>th</sup> Day</td>
        </tr>
    </table>
    </body>
</html>
